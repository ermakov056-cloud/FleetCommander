<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet Commander 2.0</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="background"></div>

<header>
<h1>⚓ Fleet Commander</h1>
<p>Морской бой нового поколения</p>
</header>

<div class="controls">
<button id="newGame">Новая игра</button>
<button id="startGame">Начать бой</button>
<button id="autoPlace">Авторасстановка</button>
</div>

<main>

<div class="boardBox">
<h2>Ваш флот</h2>
<div id="playerBoard" class="board"></div>
</div>

<div class="boardBox">
<h2>Противник</h2>
<div id="enemyBoard" class="board"></div>
</div>

</main>

<div id="status">
Добро пожаловать, Командир.
</div>

<script src="Script.js"></script>

</body>
</html>
