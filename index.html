<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fleet Commander Remastered</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="background"></div>

<header>

<div class="logo">

⚓ Fleet Commander

</div>

<div class="version">

Remastered 0.1

</div>

</header>


<main id="menu">

<div class="profile">

<h2 id="playerName">Адмирал</h2>

<p>
Уровень
<span id="level">1</span>
</p>

<p>
XP
<span id="xp">0</span>
/
100
</p>

<p>
Кредиты

<span id="money">500</span>

</p>

</div>


<div class="buttons">

<button onclick="newGame()">

▶ Новая игра

</button>

<button onclick="continueGame()">

▶ Продолжить

</button>

<button onclick="openCampaign()">

🗺 Кампания

</button>

<button onclick="openPort()">

⚓ Порт

</button>

<button onclick="openFleet()">

🚢 Мой флот

</button>

<button onclick="openSettings()">

⚙ Настройки

</button>

</div>

</main>

<div id="screen"></div>

<script src="script.js"></script>

</body>
</html>
