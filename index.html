<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Fleet Commander</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- Главное меню -->

<div id="menu-screen" class="screen main-screen">


    <div class="menu-box">


        <div class="logo">
            ⚓ Fleet Commander
        </div>


        <div class="subtitle">
            Морской бой нового поколения
        </div>



        <button id="new-game"
                class="menu-button">

            Новая игра

        </button>



        <button id="show-stats"
                class="menu-button">

            Статистика

        </button>



        <div class="info-text">

            Победы:
            <span id="wins-count">0</span>

            <br>

            Поражения:
            <span id="loses-count">0</span>

        </div>



        <button id="clear-stats"
                class="menu-button">

            Очистить статистику

        </button>


    </div>


</div>





<!-- Расстановка кораблей -->


<div id="setup-screen"
     class="screen setup-screen"
     style="display:none;">



    <h1 class="setup-title">
        Расстановка флота
    </h1>



    <div id="player-board"
         class="game-board">

    </div>



    <div class="ship-panel">


        <div class="ship-card"
             data-ship="0"
             onclick="selectShip(0)">
            4 палубы
        </div>


        <div class="ship-card"
             data-ship="1"
             onclick="selectShip(1)">
            3 палубы
        </div>


        <div class="ship-card"
             data-ship="2"
             onclick="selectShip(2)">
            3 палубы
        </div>


        <div class="ship-card"
             data-ship="3"
             onclick="selectShip(3)">
            2 палубы
        </div>


        <div class="ship-card"
             data-ship="4"
             onclick="selectShip(4)">
            2 палубы
        </div>


        <div class="ship-card"
             data-ship="5"
             onclick="selectShip(5)">
            2 палубы
        </div>


        <div class="ship-card"
             data-ship="6"
             onclick="selectShip(6)">
            1 палуба
        </div>


    </div>




    <button id="rotate-button"
            class="menu-button">

        🔄 Повернуть

    </button>



    <button id="random-button"
            class="menu-button random-button">

        🎲 Случайно

    </button>



    <button id="start-battle"
            class="menu-button start-button">

        ⚔ Начать бой

    </button>


</div>







<!-- Экран боя -->


<div id="game-screen"
     class="screen combat-screen"
     style="display:none;">



    <div class="status-panel">


        <div>
            Вы
        </div>


        <div id="turn-indicator"
             class="turn-indicator player-turn">

            Ваш ход

        </div>


        <div>
            ИИ
        </div>


    </div>





    <div id="enemy-board"
         class="game-board">

    </div>




    <div id="game-message"
         class="game-message">

        Начало боя

    </div>



    <button id="back-menu"
            class="menu-button">

        В меню

    </button>


</div>







<!-- Экран результата -->


<div id="result-screen"
     class="result-screen"
     style="display:none;">


    <div class="result-box">


        <div id="result-title"
             class="result-title">

        </div>



        <div class="result-stat">

            Спасибо за игру!

        </div>



        <button class="result-button new-game-button"
                onclick="newGame()">

            Новая игра

        </button>



        <button class="result-button menu-return-button"
                onclick="returnToMenu()">

            Главное меню

        </button>


    </div>


</div>





<script src="script.js"></script>


</body>

</html>
